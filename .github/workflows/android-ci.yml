name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Kotlin tests and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # The existing v0.3.0 source bundle has no standard gradle-wrapper.jar.
      # Install the tested-by-project Gradle version until the official wrapper is committed.
      - name: Install Gradle 8.14.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Confirm extracted Android Studio project is present
        run: |
          test -f settings.gradle.kts || { echo 'Missing settings.gradle.kts. Upload extracted project files, not only the ZIP.'; exit 1; }
          test -f core/build.gradle.kts || { echo 'Missing core/build.gradle.kts'; exit 1; }
          test -f android/build.gradle.kts || { echo 'Missing android/build.gradle.kts'; exit 1; }

      - name: Run pure Kotlin unit tests
        run: gradle --no-daemon :core:test --stacktrace

      - name: Assemble Android debug APK
        run: gradle --no-daemon :android:assembleDebug --stacktrace

      - name: Upload debug APK as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-rush-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
